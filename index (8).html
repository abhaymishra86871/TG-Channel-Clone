<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Copier</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#667085;--bd:#d8dce3;--acc:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--fg:#e8ebf0;--mut:#8b94a3;--bd:#2b323c;--acc:#5b8def;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;padding:16px}
  main{max-width:560px;margin:0 auto}
  h1{font-size:1.3rem;margin:8px 0 16px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
  label:first-child{margin-top:0}
  input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  button{padding:10px 16px;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
  button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
  button.stop{background:var(--bad)}
  button:disabled{opacity:.5;cursor:wait}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid var(--bd)}
  .bar{height:10px;border-radius:99px;background:var(--bd);overflow:hidden;margin:12px 0 8px}
  .bar>div{height:100%;width:0;background:var(--acc);transition:width .4s}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:.85rem;color:var(--mut)}
  .stats b{display:block;font-size:1.1rem;color:var(--fg)}
  pre{margin:12px 0 0;max-height:220px;overflow:auto;font-size:.75rem;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;white-space:pre-wrap}
  #msg{min-height:1.4em;margin-top:12px;font-size:.9rem}
  .err{color:var(--bad)}.good{color:var(--ok)}
  small{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>Channel Copier</h1>

  <div class="card">
    <label for="api">Render URL</label>
    <input id="api" placeholder="https://your-bot.onrender.com" autocomplete="off">

    <label for="src">Source channel ID</label>
    <input id="src" placeholder="-1001234567890" inputmode="numeric" autocomplete="off">

    <label for="dst">Destination channel ID</label>
    <input id="dst" placeholder="-1009876543210" inputmode="numeric" autocomplete="off">

    <div class="row">
      <div><label for="from">Start message ID</label><input id="from" type="number" min="1" placeholder="1"></div>
      <div><label for="to">End message ID</label><input id="to" type="number" min="1" placeholder="500"></div>
    </div>

    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4-digit PIN set in Render env">

    <div class="btns">
      <button id="bStart">Start</button>
      <button id="bResume" class="sec">Resume</button>
      <button id="bStop" class="stop">Stop</button>
      <button id="bRefresh" class="sec">Refresh</button>
    </div>
    <div id="msg"></div>
    <small>The first request can take ~1 minute if Render was asleep.</small>
  </div>

  <div class="card">
    <div><span id="status" class="pill">no data</span> <small id="route"></small></div>
    <div class="bar"><div id="fill"></div></div>
    <div class="stats">
      <div><b id="sCopied">–</b>copied</div>
      <div><b id="sSkipped">–</b>skipped</div>
      <div><b id="sNext">–</b>next ID</div>
    </div>
    <pre id="log">Enter PIN and press Refresh.</pre>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const SAVE = ['api', 'src', 'dst', 'from', 'to']; // PIN is never stored

try { SAVE.forEach((k) => { const v = localStorage.getItem('cc_' + k); if (v) $(k).value = v; }); } catch {}
const persist = () => { try { SAVE.forEach((k) => localStorage.setItem('cc_' + k, $(k).value)); } catch {} };

function say(text, cls) { const m = $('msg'); m.textContent = text; m.className = cls || ''; }

async function call(path, extra) {
  const base = $('api').value.trim().replace(/\/+$/, '');
  if (!base) throw new Error('Enter the Render URL');
  const pin = $('pin').value;
  if (!pin) throw new Error('Enter the PIN');
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 90000);
  try {
    const r = await fetch(base + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin, ...extra }),
      signal: ctl.signal,
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Server did not answer (timeout)');
    if (e instanceof TypeError) throw new Error('Cannot reach server (check URL / ALLOWED_ORIGIN)');
    throw e;
  } finally { clearTimeout(t); }
}

function render(s) {
  const pill = $('status');
  pill.textContent = s.status + (s.running ? ' ●' : '');
  pill.style.color = { running: 'var(--acc)', done: 'var(--ok)', error: 'var(--bad)', stopped: 'var(--warn)' }[s.status] || '';
  $('route').textContent = s.source ? `${s.source} → ${s.dest}  (${s.from}–${s.to})` : '';
  const total = s.to && s.from ? s.to - s.from + 1 : 0;
  const done = s.next && s.from ? Math.min(total, s.next - s.from) : 0;
  $('fill').style.width = total ? (100 * done / total).toFixed(1) + '%' : '0';
  $('sCopied').textContent = s.copied ?? '–';
  $('sSkipped').textContent = s.skipped ?? '–';
  $('sNext').textContent = s.next ?? '–';
  const lines = (s.logs || []).slice();
  if (s.lastError) lines.push('ERROR: ' + s.lastError);
  $('log').textContent = lines.join('\n') || '(no log yet)';
  $('log').scrollTop = 1e9;
}

async function refresh(quiet) {
  try { render(await call('/status')); if (!quiet) say(''); }
  catch (e) { say(e.message, 'err'); }
}

async function act(btn, path, extra, okText) {
  btn.disabled = true; say('Working…');
  try { await call(path, extra); say(okText, 'good'); persist(); await refresh(true); }
  catch (e) { say(e.message, 'err'); }
  finally { btn.disabled = false; }
}

$('bStart').onclick = (e) => act(e.target, '/start', {
  source: $('src').value.trim(), dest: $('dst').value.trim(),
  from: $('from').value, to: $('to').value,
}, 'Started.');
$('bResume').onclick = (e) => act(e.target, '/resume', {}, 'Resumed.');
$('bStop').onclick = (e) => act(e.target, '/stop', {}, 'Stop requested.');
$('bRefresh').onclick = () => refresh(false);

// auto-refresh every 5s while the tab is open and a PIN is typed
setInterval(() => { if ($('pin').value && $('api').value && !document.hidden) refresh(true); }, 5000);
</script>
</body>
</html>
